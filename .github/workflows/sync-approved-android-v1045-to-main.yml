name: Sync Approved Android v1.0.45 Source to Main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-approved-android-v1045-to-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hassoun-android-source-main-sync
  cancel-in-progress: true

jobs:
  sync-android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout main with full history and protected baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify Android production backup exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup/android-main-before-v1045-source-sync
          git rev-parse --verify refs/remotes/origin/backup/android-main-before-v1045-source-sync
          echo "Old main is backed up before Android source replacement"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Reconstruct exact passed v1.0.45 Android source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix-v1044-build-source.py
          # This job synchronizes the exact release SOURCE, not another APK.
          # Keep all historic source patches and TypeScript validation, but
          # omit repeated expensive Gradle assembly (already passed in the
          # verified v1.0.45 signed AAB workflow).
          python3 - <<'PY'
          from pathlib import Path
          for name in [".github/tablet/build-apk.sh", ".github/scripts/build-v1043-windsor-directory-resume.sh"]:
            path = Path(name)
            body = path.read_text(encoding="utf-8")
            marker = "cd mobile/android\nchmod +x gradlew\n./gradlew clean assembleRelease --no-daemon --max-workers=2 --stacktrace\n"
            assert body.count(marker) == 1, f"Source-only Gradle boundary changed in {name}"
            body = body[:body.index(marker)] + 'echo "SOURCE_ONLY_RECONSTRUCTION_COMPLETE"\n'
            path.write_text(body, encoding="utf-8")
          PY
          bash .github/scripts/build-v1045-from-approved-v1044.sh
      - name: Verify clean canonical source before committing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mobile")
          config=(p/"app.config.ts").read_text()
          home=(p/"src/HomePrayerPage.tsx").read_text()
          mosque=(p/"src/NearbyMosquesPage.tsx").read_text()
          prayer=(p/"src/prayerData.ts").read_text()
          assert 'version: "1.0.45"' in config and "versionCode: 89" in config
          assert "HASSOUN_RELEASE_WEEK_MONTH_V1045" in home
          assert "HASSOUN_NEAREST_MOSQUE_AUTO_V1045" in mosque
          assert "HASSOUN/main/windsor_islamic_association_2026_prayer_times.json" in prayer
          assert "async function fetchOfficialWindsorSchedule(" in prayer
          assert "HASSOUN_NEAREST_MOSQUE_CAR_ANIMATION_V1" in home
          assert (p/"modules/prayer-audio/android/src/main").is_dir()
          for name in ["icon.png","adaptive-icon.png","splash-logo.png","hassoun-logo.png"]:
            assert (p/"assets"/name).stat().st_size > 1000, name
          print("APPROVED_ANDROID_V1045_CANONICAL_SOURCE_VALIDATED")
          PY
      - name: Stage ONLY reconstructed Android mobile source
        shell: bash
        run: |
          set -euo pipefail
          # Historical git checkout stages script and logo differences too.
          # Preserve those files on main: only mobile/ is authorized to change.
          git restore --staged -- .github scripts || true
          # The approved v1.0.44 reconstruction contains whitespace on one
          # existing JSX line. Normalize trailing spaces in staged mobile
          # text files without touching imagery, native audio, or binary files.
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("mobile").rglob("*"):
            if not path.is_file() or path.suffix.lower() not in {".ts", ".tsx", ".js", ".jsx", ".json", ".md", ".kt", ".java", ".xml", ".gradle", ".properties"}:
              continue
            if any(part in {"node_modules", "build", ".gradle"} for part in path.parts):
              continue
            raw=path.read_bytes()
            if b"\x00" in raw: continue
            try: data=raw.decode("utf-8")
            except UnicodeDecodeError: continue
            if not any(line.rstrip(" \t") != line for line in data.splitlines()):
              continue
            fixed="\n".join(line.rstrip(" \t") for line in data.split("\n"))
            path.write_text(fixed,encoding="utf-8")
            print("Normalized source whitespace:",path)
          PY
          # Reconstructed source includes temporary npm/Gradle output. Never
          # stage generated dependencies, caches, native build output, or local
          # Firebase configuration in the canonical main branch.
          git add -A -- mobile \
            ':(exclude,glob)mobile/**/node_modules/**' \
            ':(exclude,glob)mobile/**/build/**' \
            ':(exclude,glob)mobile/**/.cxx/**' \
            ':(exclude,glob)mobile/**/.gradle/**' \
            ':(exclude,glob)mobile/**/.expo/**' \
            ':(exclude,glob)mobile/**/.env*' \
            ':(exclude,glob)mobile/**/google-services.json' \
            ':(exclude,glob)mobile/**/*.keystore' \
            ':(exclude,glob)mobile/**/*.jks'
          # The local Firebase configuration was present in the historical
          # build environment; never introduce it as a GitHub commit.
          git restore --staged -- mobile/google-services.json || true
          git diff --cached --check
          if git diff --cached --name-only | grep -v '^mobile/' ; then
            echo "Refusing to commit unexpected changes outside Android mobile/"
            exit 1
          fi
          git diff --cached --name-status > /tmp/hassoun-android-source-diff.txt
          echo "Changed Android source files:"
          cat /tmp/hassoun-android-source-diff.txt
          python3 - <<'PY'
          from pathlib import Path
          lines=Path("/tmp/hassoun-android-source-diff.txt").read_text().splitlines()
          if not lines: raise SystemExit("No Android source changes staged; main already matches the release")
          paths=[x.split("\t")[-1] for x in lines]
          for p in paths:
            if not p.startswith("mobile/"):
              raise SystemExit("Unsafe non-Android changes staged: "+p)
            if any(t in p.lower() for t in [".keystore", ".jks", "google-services.json", "/.env", "/build/outputs/", "/node_modules/"]):
              raise SystemExit("Potential private/generated Android artifact staged: "+p)
          print(f"ANDROID_SOURCE_FILES_STAGED={len(paths)}")
          PY
      - name: Commit exact v1.0.45 reconstructed source on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make Android main source canonical v1.0.45 from approved Play v1.0.44" -m "Replaces older mobile baseline with verified approved icon, native Azan, live Windsor JSON, weekly/monthly home view and GPS nearest-mosque fallback. Original main backed up at backup/android-main-before-v1045-source-sync."
          git push origin HEAD:main
          echo "ANDROID_MAIN_CANONICAL_V1045_SYNC_COMPLETE"
